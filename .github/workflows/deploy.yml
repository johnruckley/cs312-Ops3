name: Build, Smoke Test, and Push to ECR

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  id-token: write 
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull Upstream Minecraft Image
        run: |
          docker pull itzg/minecraft-server:latest
          
          docker tag itzg/minecraft-server:latest minecraft-test:local

      - name: Run Minecraft Smoke Test
        run: |
          echo "Starting Minecraft container smoke test..."
          docker run -d \
            -p 25565:25565 \
            -e EULA=TRUE \
            --name smoke-test-server \
            minecraft-test:local
          
          echo "Waiting 45 seconds for Java engine to initialize..."
          sleep 45
          
          CONTAINER_LOGS=$(docker logs smoke-test-server)
          echo "=== CONTAINER LOGS ==="
          echo "$CONTAINER_LOGS"
          echo "======================"
          
          if echo "$CONTAINER_LOGS" | grep -qi "done"; then
            echo "Smoke test PASSED: Minecraft initialized successfully."
            docker stop smoke-test-server && docker rm smoke-test-server
          else
            echo "Smoke test FAILED: Could not find initialization sequence in logs."
            docker stop smoke-test-server && docker rm smoke-test-server
            exit 1
          fi

      - name: Tag and Push Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: cs312-op2
          IMAGE_TAG: ${{ github.ref_name }} 
        run: |
          docker tag minecraft-test:local $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

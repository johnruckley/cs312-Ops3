name: Build, Smoke Test, and Push to ECR

on:
  push:
    tags:
      - 'v*.*.*' # Triggers on semantic version tags like v1.0.0

permissions:
  id-token: write # Required for passing OIDC tokens to AWS Academy
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # STEP 1: Set up Docker on the GitHub runner
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # STEP 2: Authenticate to AWS (Using AWS Academy Credentials)
      # Note: For AWS Academy, you'll need to save your AWS_ACCESS_KEY_ID, 
      # AWS_SECRET_ACCESS_KEY, and AWS_SESSION_TOKEN as GitHub Repository Secrets.
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # STEP 3: Acquire the Upstream Image & Re-tag Locally
      - name: Pull Upstream Minecraft Image
        run: |
          # Pulls a stable, production-ready upstream Minecraft image
          docker pull itzg/minecraft-server:latest
          
          # Tag it with your local test label
          docker tag itzg/minecraft-server:latest minecraft-test:local

      # STEP 4: Smoke Test (Verify initialization without errors)
      - name: Run Minecraft Smoke Test
        run: |
          echo "Starting Minecraft container smoke test..."
          docker run -d \
            -p 25565:25565 \
            -e EULA=TRUE \
            --name smoke-test-server \
            minecraft-test:local
          
          echo "Waiting 30 seconds for Java engine to initialize..."
          sleep 30
          
          # Grab container logs
          CONTAINER_LOGS=$(docker logs smoke-test-server)
          echo "=== CONTAINER LOGS ==="
          echo "$CONTAINER_LOGS"
          echo "======================"
          
          # Verify that the server started generating the spawn area (shows it works!)
          if echo "$CONTAINER_LOGS" | grep -q "Preparing start region"; then
            echo "Smoke test PASSED: Minecraft initialized successfully."
            docker stop smoke-test-server && docker rm smoke-test-server
          else
            echo "Smoke test FAILED: Could not find initialization sequence in logs."
            docker stop smoke-test-server && docker rm smoke-test-server
            exit 1
          fi

      # STEP 5: Push to ECR (Only runs if the smoke test passes)
      - name: Tag and Push Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: your-ecr-repo-name # <--- Change this to your ECR Repo name
          IMAGE_TAG: ${{ github.ref_name }} # Grabs the git tag name (e.g., v1.0.0)
        run: |
          # Tag image for ECR
          docker tag minecraft-test:local $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag minecraft-test:local $ECR_REGISTRY/$ECR_REPOSITORY:latest
          
          # Push both versioned tag and latest tag to AWS
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
